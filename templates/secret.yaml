{{- if and (not .Values.secrets.externalSecrets.enabled) (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "forgejo-runner-k8s.secretName" . }}
  labels:
    {{- include "forgejo-runner-k8s.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.secrets.registrationToken | default .Values.secrets.token | quote }}
  registrationToken: {{ .Values.secrets.registrationToken | default .Values.secrets.token | quote }}
  apiToken: {{ .Values.secrets.apiToken | default .Values.secrets.token | quote }}
{{- end }}
