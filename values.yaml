# Default values for forgejo-runner-k8s.
# Works across AMD64, ARM64, or mixed-architecture clusters.

forgejo:
  # Forgejo instance base URL (e.g. https://forgejo.example.com)
  url: "https://forgejo.example.com"
  # Scope for runner jobs: global, owner, org, or repo
  scope: "global"

runner:
  image:
    repository: "code.forgejo.org/forgejo/runner"
    tag: "12"
    pullPolicy: "IfNotPresent"
  namePrefix: "k8s-runner"
  # Labels registered with Forgejo Actions (e.g. ubuntu-latest, arm64, etc.)
  labels:
    - "ubuntu-latest:docker://node:20-bookworm"
    - "docker:docker://node:20-bookworm"
  capacity: 1
  timeout: "3h"
  insecure: false
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "2"
      memory: "2Gi"

dind:
  image:
    repository: "docker"
    tag: "28-dind"
    pullPolicy: "IfNotPresent"
  privileged: true
  # Optional in-cluster pull-through registry cache mirror (e.g. http://registry-cache.default.svc:5000)
  registryMirror: ""
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "3"
      memory: "4Gi"

autoscaling:
  enabled: true
  # "ScaledJob" (ephemeral one-shot jobs) or "ScaledObject" (scaling a Deployment)
  mode: "ScaledJob"
  minReplicas: 0
  maxReplicas: 4
  pollingInterval: 10
  cooldownPeriod: 300
  triggerLabels: "ubuntu-latest"
  # Clean up completed jobs after 60 seconds
  ttlSecondsAfterFinished: 60
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3

# Secret configuration
secrets:
  # Static tokens if not using externalSecrets
  registrationToken: ""
  apiToken: ""
  token: ""

  # If externalSecrets.enabled is true, an ExternalSecret pulls tokens from an external store
  externalSecrets:
    enabled: false
    secretStoreRef:
      name: "secret-store"
      kind: "ClusterSecretStore"
    # Remote keys in the external secret store
    registrationTokenRemoteKey: "forgejo-runner-registration-token"
    apiTokenRemoteKey: "forgejo-runner-api-token"
    remoteKey: "forgejo-runner-registration-token"

  # Existing secret name if managed manually
  existingSecret: ""

# Node scheduling (unconstrained by default, runs on any architecture)
# Example to pin to ARM64:
#   nodeSelector:
#     kubernetes.io/arch: "arm64"
nodeSelector: {}

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: "app.kubernetes.io/name"
                operator: "In"
                values: ["forgejo-runner-k8s"]
          topologyKey: "kubernetes.io/hostname"

tolerations: []
